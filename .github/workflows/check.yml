name: Package and parity checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            pandas: 'pandas==1.5.3'
            numpy: 'numpy<2'
          - python: '3.13'
            pandas: 'pandas>=3'
            numpy: 'numpy>=2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine pytest '${{ matrix.pandas }}' '${{ matrix.numpy }}' 'git+https://github.com/adatar-do/labelerpy.git@78de301ee157ee5a077a46de58aee38437a03a91'
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: python -I -m pytest tests --import-mode=importlib
      - run: python -I scripts/check-examples.py
      - uses: actions/upload-artifact@v4
        with:
          name: endompy-${{ matrix.python }}
          path: dist/*
